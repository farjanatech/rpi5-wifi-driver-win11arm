name: Build Damian Edition Wi-Fi GUI and installer

on:
  push:
    branches: [main, "damian-edition/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpi5-damian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: farjanatech/rpi5-uefi
          ref: b3f1dc6a6cd3e3c355e7fe512e4dca80cd04e51a
          path: firmware-reference
      - name: Verify the existing Damian firmware and driver resource contract
        run: |
          git -C firmware-reference submodule update --init --depth 1 edk2-platforms
          python firmware-reference/tools/apply-damian-wifi.py firmware-reference/edk2-platforms
          python tests/damian_contract_tests.py --uefi-root firmware-reference
  native:
    needs: firmware-contract
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      Configuration: Release
      Platform: ARM64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scoped driver changes and unchanged firmware contract
        shell: pwsh
        run: |
          python tests/damian_contract_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Damian Edition source/contract verification failed.' }

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Test exact hardware matching and wrong-edition rejection
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /std:c++20 /EHsc /W4 /WX tests\platform_tests.cpp /Fe:platform-tests.exe && platform-tests.exe' -f $vcvars
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Platform policy tests failed.' }
          .\tests\damian_installer_tests.ps1

      - name: Build and self-test native x64 GUI
        shell: pwsh
        run: |
          .\scripts\build-native-gui.ps1 -Architecture x64 -OutputDirectory artifacts\native-x64
          .\artifacts\native-x64\RPi5-WiFi.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Native GUI self-test failed: $LASTEXITCODE" }

      - name: Restore WDK and build ARM64 driver
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild .\rpi5-cyw43455.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=ARM64 /p:Rpi5TxCreditScheduling=1 /p:Rpi5TxGlom2=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\package-damian.ps1 -Configuration Release -Platform ARM64 -TxCreditScheduling 1 -TxGlom2 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native ARM64 GUI
        shell: pwsh
        run: .\scripts\build-native-gui.ps1 -Architecture arm64 -OutputDirectory artifacts\native-arm64

      - name: Build and self-test x64 embedded installer
        shell: pwsh
        run: |
          .\scripts\build-native-installer.ps1 -Architecture x64 -DriverPackageDirectory artifacts\rpi5cyw-test-driver -GuiPath artifacts\native-x64\RPi5-WiFi.exe -OutputDirectory artifacts\native-setup-x64
          .\artifacts\native-setup-x64\RPi5-WiFi-Setup.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installer resource self-test failed: $LASTEXITCODE" }

      - name: Build ARM64 standalone installer
        shell: pwsh
        run: .\scripts\build-native-installer.ps1 -Architecture arm64 -DriverPackageDirectory artifacts\rpi5cyw-test-driver -GuiPath artifacts\native-arm64\RPi5-WiFi.exe -OutputDirectory artifacts\native-setup-arm64

      - name: Verify ARM64 executables and compact footprint
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import struct
          files=[Path("artifacts/native-arm64/RPi5-WiFi.exe"),Path("artifacts/native-setup-arm64/RPi5-WiFi-Setup.exe")]
          for p in files:
              b=p.read_bytes()
              pe=struct.unpack_from("<I",b,0x3c)[0]
              machine=struct.unpack_from("<H",b,pe+4)[0]
              if machine != 0xaa64: raise SystemExit(f"{p} is not ARM64: {machine:#x}")
          if files[0].stat().st_size > 2_000_000: raise SystemExit("Native GUI unexpectedly large")
          if files[1].stat().st_size > 8_000_000: raise SystemExit("Standalone setup unexpectedly large")
          print("PASS: ARM64 native GUI/setup and compact footprint verified")
          '@ | python

      - name: Create release checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts\native-release -Force | Out-Null
          Copy-Item artifacts\native-setup-arm64\RPi5-WiFi-Setup.exe artifacts\native-release\RPi5-WiFi-Setup.exe
          Copy-Item artifacts\native-arm64\RPi5-WiFi.exe artifacts\native-release\RPi5-WiFi.exe
          Copy-Item docs\DAMIAN-EDITION.md artifacts\native-release\INSTALL-DAMIAN.md
          Copy-Item docs\STABILITY-UPDATE.md artifacts\native-release\STABILITY-UPDATE.md
          Copy-Item docs\RECOVERY-UPDATE.md artifacts\native-release\RECOVERY-UPDATE.md
          Copy-Item docs\LINK-STABILITY-UPDATE.md artifacts\native-release\LINK-STABILITY-UPDATE.md
          Compress-Archive -Path artifacts\rpi5cyw-test-driver\* -DestinationPath artifacts\native-release\RPi5-WiFi-Damian-Driver.zip
          @(
            'package=0.7.1.24-damian.4'
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'kernel_source_baseline=c16aa318da490350126739add45223a186ab0a47'
            'kernel_source_changed=true'
            'runtime_diagnostics=bounded-async-snapshots'
            'tx_refill=fifo-all-available-capacity'
            'warm_recovery=cccr-card-reset-before-cmd5'
            'recovery_status=terminal-errors-published'
            'link_events=preserve-authorization-during-psk-progress'
            'gui=native-win32-cpp-damian'
            'compatible_acpi=ACPI\RPI1060'
            'firmware_contract=b3f1dc6a6cd3e3c355e7fe512e4dca80cd04e51a'
            'hardware_validation=pending'
          ) | Set-Content artifacts\native-release\BUILD.txt -Encoding ASCII
          Get-ChildItem artifacts\native-release -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash,$_.Name
          } | Set-Content artifacts\native-release\SHA256SUMS.txt -Encoding ASCII


      - uses: actions/upload-artifact@v4
        with:
          name: rpi5-wifi-native-v0.7.1.24-damian.4
          path: artifacts/native-release/
          if-no-files-found: error
