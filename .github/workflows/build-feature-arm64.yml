name: Build RPi5 CYW43455 ARM64 feature branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-feature-arm64.yml'
      - 'ci-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      Configuration: Debug
      Platform: ARM64
      SourceBranch: bringup/cyw43455-sdio-arm64

    steps:
      - name: Checkout driver development branch
        uses: actions/checkout@v4
        with:
          ref: bringup/cyw43455-sdio-arm64
          fetch-depth: 0

      - name: Record source commit
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "SOURCE_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          "SourceBranch=$env:SourceBranch" | Set-Content ci-logs/toolchain.txt
          "SourceCommit=$sha" | Add-Content ci-logs/toolchain.txt

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install NuGet CLI
        uses: NuGet/setup-nuget@v2

      - name: Record runner toolchain
        shell: pwsh
        run: |
          "ControllerCommit=$env:GITHUB_SHA" | Add-Content ci-logs/toolchain.txt
          "Runner=$env:RUNNER_OS $env:RUNNER_ARCH" | Add-Content ci-logs/toolchain.txt
          "ImageOS=$env:ImageOS" | Add-Content ci-logs/toolchain.txt
          "ImageVersion=$env:ImageVersion" | Add-Content ci-logs/toolchain.txt
          msbuild -version | Out-String | Add-Content ci-logs/toolchain.txt
          nuget help | Select-Object -First 5 | Out-String | Add-Content ci-logs/toolchain.txt

      - name: Restore WDK and SDK NuGet packages
        id: restore
        continue-on-error: true
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive -Verbosity detailed 2>&1 |
            Tee-Object -FilePath ci-logs/nuget-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem packages -Directory | Select-Object Name,FullName |
            Format-Table -AutoSize | Out-String | Set-Content ci-logs/restored-packages.txt

      - name: Build Debug ARM64
        id: build
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild .\rpi5-cyw43455.sln /m /t:Rebuild `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /bl:ci-logs\build.binlog `
            /fl "/flp:logfile=ci-logs\build.log;verbosity=diagnostic"
          exit $LASTEXITCODE

      - name: Inventory build outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem . -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.sys','.pdb','.inf','.cat','.log' -and $_.FullName -notmatch '\\packages\\' } |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize | Out-String -Width 500 | Set-Content ci-logs/build-outputs.txt

      - name: Package and test-sign driver
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          .\scripts\package-ci.ps1 -Configuration $env:Configuration -Platform $env:Platform 2>&1 |
            Tee-Object -FilePath ci-logs/package.log
          exit $LASTEXITCODE

      - name: Upload ready driver package
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-cyw43455-win11-arm64-debug
          path: artifacts/rpi5cyw-test-driver/
          if-no-files-found: error
          retention-days: 30

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-cyw43455-ci-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish result to ci-output branch
        if: always()
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'rpi5cyw-ci-publish'
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }
          New-Item -ItemType Directory -Path $publish -Force | Out-Null

          @"
          SOURCE_BRANCH=$env:SourceBranch
          SOURCE_COMMIT=$env:SOURCE_SHA
          CONTROLLER_COMMIT=$env:GITHUB_SHA
          WORKFLOW_RUN=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          RESTORE_OUTCOME=${{ steps.restore.outcome }}
          BUILD_OUTCOME=${{ steps.build.outcome }}
          PACKAGE_OUTCOME=${{ steps.package.outcome }}
          CONFIGURATION=$env:Configuration
          PLATFORM=$env:Platform
          "@ | Set-Content (Join-Path $publish 'STATUS.txt') -Encoding UTF8

          if (Test-Path 'ci-logs') { Copy-Item 'ci-logs' (Join-Path $publish 'ci-logs') -Recurse -Force }
          if ('${{ steps.package.outcome }}' -eq 'success' -and (Test-Path 'artifacts\rpi5cyw-test-driver')) {
            Compress-Archive -Path 'artifacts\rpi5cyw-test-driver\*' `
              -DestinationPath (Join-Path $publish 'rpi5-cyw43455-win11-arm64-debug.zip') -Force
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan ci-output
          git rm -rf . 2>$null
          git clean -fdx
          Copy-Item (Join-Path $publish '*') . -Recurse -Force
          git add -A
          git commit -m "CI output for $env:SOURCE_SHA"
          git push --force origin HEAD:ci-output

      - name: Fail if generation failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.restore.outcome }}' -ne 'success') { Write-Error 'WDK restore failed.'; exit 1 }
          if ('${{ steps.build.outcome }}' -ne 'success') { Write-Error 'ARM64 driver build failed.'; exit 1 }
          if ('${{ steps.package.outcome }}' -ne 'success') { Write-Error 'Packaging/test-signing failed.'; exit 1 }
          Write-Host 'Driver generation succeeded.'
