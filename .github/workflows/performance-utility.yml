name: Validate and package standalone performance utility
on:
  push:
    branches: [bringup/cyw43455-sdio-arm64]
    paths:
      - 'utility/**'
      - 'tests/performance_utility_tests.ps1'
      - 'tests/radio_utility_tests.ps1'
      - 'tests/timing_utility_tests.ps1'
      - 'scripts/package-performance.ps1'
      - 'docs/PERFORMANCE-0.6.27.1.md'
      - 'tests/download_timing_tests.ps1'
      - 'tests/measurement_clock_tests.ps1'
      - 'tests/focused_scope_tests.ps1'
      - 'tests/readiness_utility_tests.ps1'
      - 'tests/transport_utility_tests.ps1'
      - '.github/workflows/performance-utility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve driver and comparative workload scope
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/focused_scope_tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          $issues = @('utility/Test-RPi5-WiFi-Performance.ps1','utility/Measure-RPi5-WiFi-Load.ps1','tests/performance_utility_tests.ps1','scripts/package-performance.ps1','utility/Get-RPi5-WiFi-Radio.ps1','tests/radio_utility_tests.ps1','utility/Get-RPi5-WiFi-Timing.ps1','tests/timing_utility_tests.ps1','utility/Get-RPi5-WiFi-Transport.ps1','tests/transport_utility_tests.ps1') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error
          }
          $issues += @('utility/RPi5-WiFi-Operations.ps1','utility/Check-RPi5-WiFi-Readiness.ps1','utility/Connect-RPi5-WiFi.ps1','tests/readiness_utility_tests.ps1') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error
          }
          $issues += @('utility/RPi5-WiFi-DownloadTiming.ps1','utility/RPi5-WiFi-MeasurementClock.ps1','tests/download_timing_tests.ps1','tests/measurement_clock_tests.ps1','tests/focused_scope_tests.ps1') | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error
          }
          $issues | Format-Table -AutoSize
          if ($issues) { throw 'Script analysis failed.' }
      - name: Windows PowerShell 5.1 tests (mocked requests, no hardware)
        shell: pwsh
        run: |
          $failedTests = @()
          foreach ($test in @('download_timing','measurement_clock','performance_utility','radio_utility','timing_utility','transport_utility','readiness_utility')) {
            $testArgs = @('-NoProfile','-ExecutionPolicy','Bypass','-File',"tests/${test}_tests.ps1")
            if ($test -eq 'measurement_clock') { $testArgs += '-NativeSmoke' }
            & powershell.exe @testArgs
            if ($LASTEXITCODE -ne 0) { $failedTests += $test }
          }
          if ($failedTests.Count -ne 0) { throw "Utility tests failed: $($failedTests -join ', ')" }
      - name: Package allowlisted utility
        shell: pwsh
        run: ./scripts/package-performance.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rpi5-wifi-performance-0.6.27.1
          path: |
            artifacts/RPi5-WiFi-Performance-0.6.27.1.zip
            artifacts/PERFORMANCE-SHA256SUMS.txt
          if-no-files-found: error
