name: Build CYW43455 direct-SDIO NDIS ARM64 driver

on:
  push:
    branches:
      - bringup/cyw43455-sdio-arm64
      - feature/rpi-os-wifi-performance
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional empty performance draft ID; stages an already tested build, without rebuilding
        required: false
      build_run:
        description: Successful source-matched build run ID (draft staging only)
        required: false
      source_sha:
        description: Exact tested 40-character performance source commit (draft staging only)
        required: false

permissions:
  contents: read

concurrency:
  group: cyw43455-direct-sdio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    if: inputs.release_id == ''
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      Configuration: Release
      Platform: ARM64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce performance-branch isolation and protected baseline scope
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/performance_scope_tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install NuGet CLI
        uses: NuGet/setup-nuget@v2

      - name: Create log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path ci-logs -Force | Out-Null

      - name: Compile and run SDIO protocol tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual C++ build tools were not found.' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC tests\sdio_protocol_tests.c /Fe:ci-logs\sdio_protocol_tests.exe && ci-logs\sdio_protocol_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\sdio-protocol-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Simulate actual SDIO and chip startup code
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC /std:c17 tests\sdio_host_tests.c /Fe:ci-logs\sdio_host_tests.exe && ci-logs\sdio_host_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\sdio-host-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test network wire formats and credential ABI
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC tests\network_protocol_tests.c /Fe:ci-logs\network_protocol_tests.exe && ci-logs\network_protocol_tests.exe && cl /nologo /W4 /WX /TC /std:c17 tests\connection_sequence_tests.c /Fe:ci-logs\connection_sequence_tests.exe && ci-logs\connection_sequence_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\network-protocol-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test production transport flow control, receive batching and recovery
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\transport_tests.c /Fe:ci-logs\transport_tests.exe && ci-logs\transport_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\transport-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Address-sanitize production transport helpers and register model
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /O1 /Zi /fsanitize=address /W4 /WX /TC /std:c17 tests\transport_tests.c /Fe:ci-logs\transport_asan.exe && ci-logs\transport_asan.exe && cl /nologo /O1 /Zi /fsanitize=address /W4 /WX /TC /std:c17 tests\sdio_host_tests.c /Fe:ci-logs\sdio_asan.exe && ci-logs\sdio_asan.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\transport-asan.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bounded startup band policy
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\band_policy_tests.c /Fe:ci-logs\band_policy_tests.exe && ci-logs\band_policy_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\band-policy-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test traffic counters and actual NDIS statistics mapping
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC tests\traffic_stats_tests.c /Fe:ci-logs\traffic_stats_tests.exe && ci-logs\traffic_stats_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\traffic-stats-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test actual pending-send ownership, immediate completions and lifecycle
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC /std:c17 tests\tx_queue_tests.c /Fe:ci-logs\tx_queue_tests.exe && ci-logs\tx_queue_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\tx-queue-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bounded idle-credit retry and production eligibility gates
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\tx_retry_tests.c /Fe:ci-logs\tx_retry_tests.exe && ci-logs\tx_retry_tests.exe && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\tx_retry_gate_tests.c /Fe:ci-logs\tx_retry_gate_tests.exe && ci-logs\tx_retry_gate_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\tx-retry-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test actual firmware control replies and connection integration
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC /std:c17 tests\control_reply_tests.c /Fe:ci-logs\control_reply_tests.exe && ci-logs\control_reply_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\control-reply-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bounded disconnected scan wire format and sequence
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\scan_protocol_tests.c /Fe:ci-logs\scan_protocol_tests.exe && ci-logs\scan_protocol_tests.exe && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\scan_sequence_tests.c /Fe:ci-logs\scan_sequence_tests.exe && ci-logs\scan_sequence_tests.exe && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\scan_control_tests.c /Fe:ci-logs\scan_control_tests.exe && ci-logs\scan_control_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\scan-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test actual read-only radio queries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC /std:c17 tests\radio_tests.c /Fe:ci-logs\radio_tests.exe && ci-logs\radio_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\radio-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test runtime timing helpers and snapshot ABI
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /O2 /W4 /WX /TC /std:c17 tests\timing_tests.c /Fe:ci-logs\timing_tests.exe && ci-logs\timing_tests.exe && cl /nologo /O2 /W4 /WX /TC /std:c17 /DRPI5CYW_DETAILED_TIMING=1 tests\timing_tests.c /Fe:ci-logs\timing_detail_tests.exe && ci-logs\timing_detail_tests.exe && cl /nologo /O2 /W4 /WX /TC /std:c17 /DRPI5CYW_DETAILED_TIMING=1 tests\sdio_host_tests.c /Fe:ci-logs\sdio_detail_tests.exe && ci-logs\sdio_detail_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\timing-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test one-click diagnostics utility
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          $analysisPaths = @(
            '.\diagnostics\Collect-RPi5-WiFi-Diagnostics.ps1',
            '.\installer\Install-RPi5-WiFi-Driver.ps1',
            '.\scripts\package-diagnostics.ps1',
            '.\tests\diagnostics_utility_tests.ps1',
            '.\tests\installer_utility_tests.ps1',
            '.\utility\Connect-RPi5-WiFi.ps1',
            '.\tests\connection_utility_tests.ps1',
            '.\utility\Set-RPi5-WiFi-Autoconnect.ps1',
            '.\utility\RPi5-WiFi-Operations.ps1',
            '.\utility\Check-RPi5-WiFi-Readiness.ps1',
            '.\tests\readiness_utility_tests.ps1',
            '.\utility\RPi5-WiFi-App.ps1',
            '.\utility\RPi5-WiFi-Scan.ps1',
            '.\tests\scan_utility_tests.ps1',
            '.\tests\autoconnect_utility_tests.ps1',
            '.\utility\Test-RPi5-WiFi-Performance.ps1',
            '.\utility\Measure-RPi5-WiFi-Load.ps1',
            '.\tests\performance_utility_tests.ps1',
            '.\utility\RPi5-WiFi-DownloadTiming.ps1',
            '.\utility\RPi5-WiFi-MeasurementClock.ps1',
            '.\tests\download_timing_tests.ps1',
            '.\tests\measurement_clock_tests.ps1',
            '.\tests\focused_scope_tests.ps1',
            '.\utility\Get-RPi5-WiFi-Radio.ps1',
            '.\tests\radio_utility_tests.ps1',
            '.\utility\Get-RPi5-WiFi-Timing.ps1',
            '.\tests\timing_utility_tests.ps1',
            '.\utility\Get-RPi5-WiFi-Transport.ps1',
            '.\tests\transport_utility_tests.ps1',
            '.\tests\firmware_package_tests.ps1',
            '.\scripts\fetch-firmware.ps1'
          )
          $analysis = @($analysisPaths | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error,Warning })
          $analysis | Format-List ScriptName,Line,Column,RuleName,Severity,Message | Out-String -Width 500 |
            Tee-Object -FilePath ci-logs\diagnostics-scriptanalyzer.log
          if ($analysis.Count -ne 0) {
            throw "PSScriptAnalyzer reported $($analysis.Count) error(s)/warning(s)."
          }
          # Each script gets a real process exit code. In-process scripts with
          # no native calls leave LASTEXITCODE null/stale and can skip tests.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\diagnostics_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\diagnostics-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\installer_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\installer-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\connection_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\connection-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\autoconnect_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\autoconnect-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\readiness_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\readiness-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\scan_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\scan-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\radio_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\radio-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\timing_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\timing-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\transport_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\transport-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render offline connection app preview
        shell: pwsh
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File utility/RPi5-WiFi-App.ps1 -PreviewPath ci-logs\wifi-app.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath ci-logs\wifi-app.png)) { throw 'Connection app preview was not produced.' }

      - name: Simulate actual firmware startup with bus failures
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC /std:c17 tests\firmware_tests.c /Fe:ci-logs\firmware_tests.exe && ci-logs\firmware_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\firmware-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test bounded automatic performance utility without hardware
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\download_timing_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\download-timing-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\measurement_clock_tests.ps1 -NativeSmoke 2>&1 |
            Tee-Object -FilePath ci-logs\measurement-clock-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\performance_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\performance-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record runner toolchain
        shell: pwsh
        run: |
          "Commit=$env:GITHUB_SHA" | Set-Content ci-logs/toolchain.txt
          "Runner=$env:RUNNER_OS $env:RUNNER_ARCH" | Add-Content ci-logs/toolchain.txt
          "ImageOS=$env:ImageOS" | Add-Content ci-logs/toolchain.txt
          "ImageVersion=$env:ImageVersion" | Add-Content ci-logs/toolchain.txt
          msbuild -version | Out-String | Add-Content ci-logs/toolchain.txt
          nuget help | Select-Object -First 5 | Out-String | Add-Content ci-logs/toolchain.txt

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive -Verbosity detailed 2>&1 |
            Tee-Object -FilePath ci-logs/nuget-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build optimized Release ARM64 with symbols
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild .\rpi5-cyw43455.sln /m /t:Rebuild `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /bl:ci-logs\build.binlog `
            /fl "/flp:logfile=ci-logs\build.log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Verify effective flags, not only project intent: WDK defaults can
          # otherwise append /Os after /O2 and favor code size over speed.
          $commands = @(Select-String -LiteralPath ci-logs/build.log -Pattern '\bCL\.exe /c ' | ForEach-Object Line)
          if (-not $commands.Count) { throw 'No compiler commands found for optimization verification.' }
          foreach ($command in $commands) {
            if ($command -notmatch '\s/O2\s' -or $command -notmatch '\s/Ot\s' -or
                $command -match '\s/(Od|Os)\s' -or $command -notmatch 'RPI5CYW_DETAILED_TIMING=0\s') {
              throw 'Effective compiler flags do not match the optimized, low-overhead release policy.'
            }
          }
          Write-Host 'Verified effective /O2 /Ot Release flags and detailed timing disabled.'

      - name: Inventory build outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem . -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.sys','.pdb','.inf','.cat','.log' -and $_.FullName -notmatch '\\packages\\' } |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize | Out-String -Width 500 | Set-Content ci-logs/build-outputs.txt

      - name: Package and test-sign driver
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          .\scripts\package-ci.ps1 -Configuration $env:Configuration -Platform $env:Platform 2>&1 |
            Tee-Object -FilePath ci-logs/package.log
          exit $LASTEXITCODE

      - name: Package one-click diagnostics utility
        id: diagnostics
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          .\scripts\package-diagnostics.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\package-diagnostics.log
          exit $LASTEXITCODE

      - name: Upload direct-SDIO driver package
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-cyw43455-direct-sdio-ndis-arm64-release
          path: artifacts/rpi5cyw-test-driver/
          if-no-files-found: error
          retention-days: 30

      - name: Upload one-click diagnostics utility
        if: steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-wifi-one-click-diagnostics-v0.6.27
          path: artifacts/rpi5-wifi-one-click-diagnostics/
          if-no-files-found: error
          retention-days: 90

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-cyw43455-direct-sdio-ci-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow if build or packaging failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outcome }}' -ne 'success') {
            Write-Error 'ARM64 direct-SDIO NDIS driver build failed. See CI log artifact.'
            exit 1
          }
          if ('${{ steps.package.outcome }}' -ne 'success') {
            Write-Error 'Driver packaging/test-signing failed. See CI log artifact.'
            exit 1
          }
          if ('${{ steps.diagnostics.outcome }}' -ne 'success') {
            Write-Error 'Diagnostics utility packaging failed. See CI log artifact.'
            exit 1
          }
          Write-Host 'ARM64 direct-SDIO NDIS driver package built successfully.'

  stage-performance-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.release_id != '' && github.ref == 'refs/heads/feature/rpi-os-wifi-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: farjanatech/rpi5-wifi-driver-win11arm
      BUILD_RUN: ${{ inputs.build_run }}
      EXPECTED_COMMIT: ${{ inputs.source_sha }}
      RELEASE_ID: ${{ inputs.release_id }}
      RELEASE_TAG: driver-perf0.7.0-alpha.1
    steps:
      - name: Require tested performance source and empty unpublished draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$RELEASE_ID" =~ ^[0-9]+$ && "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" | jq -e --arg commit "$EXPECTED_COMMIT" --arg repo "$GH_REPO" '.conclusion == "success" and .head_sha == $commit and .head_repository.full_name == $repo and .head_branch == "feature/rpi-os-wifi-performance" and .path == ".github/workflows/build-arm64-driver.yml"' >/dev/null
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e --arg commit "$EXPECTED_COMMIT" --arg tag "$RELEASE_TAG" '.draft == true and .prerelease == true and .target_commitish == $commit and .tag_name == $tag and (.assets | length) == 0' >/dev/null
      - name: Fetch and verify complete signed package on GitHub
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --name rpi5-cyw43455-direct-sdio-ndis-arm64-release --dir package
          grep -Fx "driver_commit=$EXPECTED_COMMIT" <(tr -d '\r' < package/SOURCE_REVISION.txt)
          grep -Fx 'driver_version=0.7.0' <(tr -d '\r' < package/SOURCE_REVISION.txt)
          (cd package && tr -d '\r' < SHA256SUMS.txt | sha256sum --check)
          test -s package/rpi5cyw.sys && test -s package/rpi5cyw.cat && test -s package/rpi5cyw-test.cer
          test -s package/PERFORMANCE-0.7.0.md && test -s package/Install-RPi5-WiFi-Driver.cmd
      - name: ZIP and stage without publishing or replacing working releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-output
          (cd package && zip -q -r ../release-output/RPi5-WiFi-Windows11-ARM64-perf0.7.0-alpha.1.zip .)
          (cd release-output && sha256sum RPi5-WiFi-Windows11-ARM64-perf0.7.0-alpha.1.zip > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" release-output/RPi5-WiFi-Windows11-ARM64-perf0.7.0-alpha.1.zip release-output/SHA256SUMS.txt
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '{id,draft,tag_name,target_commitish,assets:[.assets[]|{name,size,digest}]}'
