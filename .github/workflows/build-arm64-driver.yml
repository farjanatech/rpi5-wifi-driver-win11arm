name: Build CYW43455 direct-SDIO NDIS ARM64 driver

on:
  push:
    branches:
      - bringup/cyw43455-sdio-arm64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyw43455-direct-sdio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      Configuration: Debug
      Platform: ARM64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install NuGet CLI
        uses: NuGet/setup-nuget@v2

      - name: Create log directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path ci-logs -Force | Out-Null

      - name: Compile and run SDIO protocol tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual C++ build tools were not found.' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "{0}" && cl /nologo /W4 /WX /TC tests\sdio_protocol_tests.c /Fe:ci-logs\sdio_protocol_tests.exe && ci-logs\sdio_protocol_tests.exe' -f $vcvars
          cmd.exe /d /s /c $command 2>&1 | Tee-Object -FilePath ci-logs\sdio-protocol-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test one-click diagnostics utility
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
          $analysis = @(
            '.\diagnostics\Collect-RPi5-WiFi-Diagnostics.ps1',
            '.\installer\Install-RPi5-WiFi-Driver.ps1',
            '.\scripts\package-diagnostics.ps1',
            '.\tests\diagnostics_utility_tests.ps1',
            '.\tests\installer_utility_tests.ps1'
          ) | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error,Warning }
          $analysis | Format-Table -AutoSize | Out-String -Width 500 |
            Tee-Object -FilePath ci-logs\diagnostics-scriptanalyzer.log
          if ($analysis.Count -ne 0) {
            throw "PSScriptAnalyzer reported $($analysis.Count) error(s)/warning(s)."
          }
          .\tests\diagnostics_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\diagnostics-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tests\installer_utility_tests.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\installer-utility-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record runner toolchain
        shell: pwsh
        run: |
          "Commit=$env:GITHUB_SHA" | Set-Content ci-logs/toolchain.txt
          "Runner=$env:RUNNER_OS $env:RUNNER_ARCH" | Add-Content ci-logs/toolchain.txt
          "ImageOS=$env:ImageOS" | Add-Content ci-logs/toolchain.txt
          "ImageVersion=$env:ImageVersion" | Add-Content ci-logs/toolchain.txt
          msbuild -version | Out-String | Add-Content ci-logs/toolchain.txt
          nuget help | Select-Object -First 5 | Out-String | Add-Content ci-logs/toolchain.txt

      - name: Restore WDK and SDK NuGet packages
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive -Verbosity detailed 2>&1 |
            Tee-Object -FilePath ci-logs/nuget-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Debug ARM64
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild .\rpi5-cyw43455.sln /m /t:Rebuild `
            /p:Configuration=$env:Configuration `
            /p:Platform=$env:Platform `
            /bl:ci-logs\build.binlog `
            /fl "/flp:logfile=ci-logs\build.log;verbosity=diagnostic"
          exit $LASTEXITCODE

      - name: Inventory build outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem . -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.sys','.pdb','.inf','.cat','.log' -and $_.FullName -notmatch '\\packages\\' } |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize | Out-String -Width 500 | Set-Content ci-logs/build-outputs.txt

      - name: Package and test-sign driver
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          .\scripts\package-ci.ps1 -Configuration $env:Configuration -Platform $env:Platform 2>&1 |
            Tee-Object -FilePath ci-logs/package.log
          exit $LASTEXITCODE

      - name: Package one-click diagnostics utility
        id: diagnostics
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          .\scripts\package-diagnostics.ps1 2>&1 |
            Tee-Object -FilePath ci-logs\package-diagnostics.log
          exit $LASTEXITCODE

      - name: Upload direct-SDIO driver package
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-cyw43455-direct-sdio-ndis-arm64-debug
          path: artifacts/rpi5cyw-test-driver/
          if-no-files-found: error
          retention-days: 30

      - name: Upload one-click diagnostics utility
        if: steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-wifi-one-click-diagnostics-v0.2.1
          path: artifacts/rpi5-wifi-one-click-diagnostics/
          if-no-files-found: error
          retention-days: 90

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi5-cyw43455-direct-sdio-ci-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow if build or packaging failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outcome }}' -ne 'success') {
            Write-Error 'ARM64 direct-SDIO NDIS driver build failed. See CI log artifact.'
            exit 1
          }
          if ('${{ steps.package.outcome }}' -ne 'success') {
            Write-Error 'Driver packaging/test-signing failed. See CI log artifact.'
            exit 1
          }
          if ('${{ steps.diagnostics.outcome }}' -ne 'success') {
            Write-Error 'Diagnostics utility packaging failed. See CI log artifact.'
            exit 1
          }
          Write-Host 'ARM64 direct-SDIO NDIS driver package built successfully.'
